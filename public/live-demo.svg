<svg viewBox="0 0 99 99" width="99" height="99" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer subtle bezel / border rim for depth -->
  <rect x="0.5" y="0.5" width="98" height="98" rx="27" fill="#000000" stroke="#262626" stroke-width="1" />
  
  <!-- Icon -->
  <g stroke="#bee186" stroke-width="4.2" stroke-linecap="butt" stroke-linejoin="miter" fill="none">
    <!-- Globe Outer Circle (Cutout in bottom right for cursor) -->
    <path d="M 49.5 28 A 21.5 21.5 0 1 0 49.5 71 A 21.5 21.5 0 0 0 71 49.5" />
    
    <!-- Equator Line -->
    <path d="M 28 43.5 H 71" />
    
    <!-- Lower Latitude Line -->
    <path d="M 30.5 56.5 H 52" />
    
    <!-- Left Meridian Arc -->
    <path d="M 49.5 28 A 10.5 21.5 0 0 0 49.5 71" />
    
    <!-- Right Meridian Arc -->
    <path d="M 49.5 28 A 10.5 21.5 0 0 1 60 49.5" />
    
    <!-- Center Meridian Line -->
    <path d="M 49.5 28 V 71" />
    
    <!-- Pointer Cursor -->
    <path d="M 71.5 58.5 H 58.5 V 71.5" />
    <path d="M 58.5 58.5 L 72.5 72.5" stroke-linecap="square" />
  </g>
</svg>